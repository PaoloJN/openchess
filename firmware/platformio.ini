; PlatformIO Project Configuration File
;
; OpenChess firmware — forked structurally from joojoooo/OpenChess.
; Engine sources live in src/engine/, shell sources in src/shell/.
; Native test environment runs Unity tests against pure-logic engine pieces.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_flags =
    -DCORE_DEBUG_LEVEL=3
; Default build = the real board firmware: BLE transport + hardware layer.
; (Each bench env below overrides this filter to compile a single file.)
build_src_filter =
    -<*>
    +<main.cpp>
    +<shell/ble_board.cpp>
    +<ui/ui_oled.cpp>
    +<engine/board_driver.cpp>
    +<engine/chess_engine.cpp>
    +<engine/chess_ai.cpp>
    +<engine/led_language.cpp>
    +<engine/game_controller.cpp>
    +<engine/chess_utils.cpp>
    +<engine/log.cpp>
lib_deps =
    makuna/NeoPixelBus@^2.8.4
    bblanchon/ArduinoJson@^7.4.3
    h2zero/NimBLE-Arduino@^2.3.9
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
lib_ignore =
    ESPAsyncTCP
    RPAsyncTCP
    ESP32 BLE Arduino
lib_ldf_mode = deep

; ── Bench bring-up tests (flash one at a time) ────────────────────────
; Each compiles ONLY its own bench file (not main.cpp / engine).
;   pio run -e bench_led    -t upload   # LED chain walk + color check
;   pio run -e bench_sensor -t upload   # hall matrix -> serial board print
;   pio run -e bench_web    -t upload   # WiFi AP + live web dashboard
[env:bench_alive]
extends = env:esp32dev
build_src_filter = -<*> +<bench/signs_of_life.cpp>

[env:bench_led]
extends = env:esp32dev
build_src_filter = -<*> +<bench/led_walk.cpp>

[env:bench_sensor]
extends = env:esp32dev
build_src_filter = -<*> +<bench/sensor_scan.cpp>

[env:bench_highlight]
extends = env:esp32dev
build_src_filter = -<*> +<bench/highlight.cpp>

; Panel bring-up (J3 harness). Do buttons FIRST (serial works), then OLED.
;   pio run -e bench_buttons -t upload   # 3 panel buttons -> serial
;   pio run -e bench_oled    -t upload   # SSD1306 OLED + live button states
; NOTE: OLED SDA/SCL = GPIO1/3 = USB-serial pins. Unplug OLED data leads to
; flash bench_oled; it reports status on matrix LED #0 (green ok / red fail).
[env:bench_buttons]
extends = env:esp32dev
build_src_filter = -<*> +<bench/panel_buttons.cpp>

[env:bench_oled]
extends = env:esp32dev
build_src_filter = -<*> +<bench/panel_oled.cpp>

; Interactive shell: OLED menu + buttons + LED effects (the app skeleton).
;   pio run -e bench_demo -t upload   # unplug OLED SDA/SCL to flash, then reset
[env:bench_demo]
extends = env:esp32dev
build_src_filter = -<*> +<bench/panel_demo.cpp>

; Phase 0 — read the full 8x8 board through the adapted engine BoardDriver.
;   pio run -e bench_board -t upload
[env:bench_board]
extends = env:esp32dev
build_src_filter = -<*> +<bench/board_read.cpp> +<engine/board_driver.cpp> +<engine/chess_utils.cpp> +<engine/log.cpp>

; Phase 0 — LED-map checker, OLED-driven (no serial). Leave the OLED plugged in.
;   pio run -e bench_map -t upload
[env:bench_map]
extends = env:esp32dev
build_src_filter = -<*> +<bench/bench_map.cpp> +<engine/board_driver.cpp> +<engine/chess_utils.cpp> +<engine/log.cpp>

; Phase 1 — light-language coaching demo (OLED-driven, real engine). OLED stays plugged.
;   pio run -e bench_coach -t upload
[env:bench_coach]
extends = env:esp32dev
build_src_filter = -<*> +<bench/bench_coach.cpp> +<engine/led_language.cpp> +<engine/board_driver.cpp> +<engine/chess_engine.cpp> +<engine/chess_utils.cpp> +<engine/log.cpp>

; OLED UI shell — all 13 board screens (Claude Design "Board OLED"). OLED-only.
;   pio run -e bench_ui -t upload
[env:bench_ui]
extends = env:esp32dev
build_src_filter = -<*> +<bench/bench_ui.cpp> +<ui/ui_oled.cpp>

[env:native]
platform = native
test_framework = unity
test_build_src = yes
test_ignore = test_ai
build_src_filter =
    -<*>
    +<shell/protocol.cpp>
build_flags =
    -std=c++17
    -DUNIT_TEST
    -Isrc
lib_deps =
    bblanchon/ArduinoJson@^7.4.3

; Offline AI tests (quiescence / PST eval / iterative deepening):
;   pio test -e native_ai
[env:native_ai]
platform = native
test_framework = unity
test_build_src = yes
test_filter = test_ai
build_src_filter =
    -<*>
    +<engine/chess_engine.cpp>
    +<engine/chess_ai.cpp>
build_flags =
    -std=c++17
    -O2
    -DUNIT_TEST
    -Isrc
    -Itest/support

[env:bench_diag]
extends = env:esp32dev
build_src_filter = -<*> +<bench/diag_a5.cpp>

; Side quest — RoArm-M2-S ESP-NOW leader. Serial console at 115200:
;   home | grip <0-180> | open | close | pos <x> <y> <z> | led <0-255> | json <raw> | demo
;   pio run -e bench_roarm -t upload --upload-port /dev/cu.usbserial-10
; (usbserial-10 = OpenChess DevKitC; usbserial-210 = the ARM. Never swap.)
[env:bench_roarm]
extends = env:esp32dev
build_src_filter = -<*> +<bench/bench_roarm.cpp>
