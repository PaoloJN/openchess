<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OpenChess — System Overview</title>
<style>
  :root {
    --bg: #0b0b0d;
    --ink: #ececec;
    --ink-dim: #8a8a8e;
    --line: #2a2a2f;
    --pcb: #2b2b2f;
    --pcb-edge: #4a4a52;
    --silk: #d6d6da;
    --controller: #c8443a;
    --controller-edge: #8a2e26;
    --ui: #e6c84a;
    --ui-edge: #a98e1c;
    --esp: #0c0c10;
    --m1: #1d6b3a;
    --m1-edge: #0e3a1f;
    --battery: #6b7280;
    --battery-edge: #3a4048;
    --cable-power: #c8443a;
    --cable-gnd: #2a2a2f;
    --cable-data: #e6c84a;
    --cable-usb: #4a8fd6;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace;
    --sans: ui-sans-serif, "IBM Plex Sans", system-ui, sans-serif;
  }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 1700px;
    margin: 0 auto;
    padding: 40px 48px 64px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 18px;
    margin-bottom: 28px;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
  }
  .meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .canvas { width: 100%; height: auto; display: block; }
  footer {
    margin-top: 28px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
    border-top: 1px solid var(--line);
    padding-top: 18px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.04em;
  }
  footer .key { color: var(--ink); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 8px; vertical-align: 1px; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>OpenChess — System Overview · bottom view</h1>
    <div class="meta">rev 0.2 · 2026-06-05 · per DESIGN_NOTES.md</div>
  </header>

  <svg class="canvas" viewBox="0 0 1700 1380" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#9a9aa0"/>
      </marker>
      <marker id="arrowS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#9a9aa0"/>
      </marker>
      <pattern id="checker" x="0" y="0" width="64" height="64" patternUnits="userSpaceOnUse">
        <rect width="64" height="64" fill="#1c1c20"/>
        <rect width="32" height="32" fill="#222227"/>
        <rect x="32" y="32" width="32" height="32" fill="#222227"/>
      </pattern>
      <pattern id="silkdot" x="0" y="0" width="64" height="64" patternUnits="userSpaceOnUse">
        <circle cx="32" cy="32" r="1.2" fill="#3a3a40"/>
      </pattern>
      <linearGradient id="ctrlGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#cf4a40"/>
        <stop offset="1" stop-color="#a83930"/>
      </linearGradient>
      <linearGradient id="uiGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ebcf57"/>
        <stop offset="1" stop-color="#c9a92e"/>
      </linearGradient>
      <linearGradient id="m1Grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#247845"/>
        <stop offset="1" stop-color="#143f24"/>
      </linearGradient>
      <linearGradient id="battGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8b95a4"/>
        <stop offset="1" stop-color="#525a66"/>
      </linearGradient>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6"/>
      </filter>
    </defs>

    <!-- ===================== LEFT COLUMN: SIDE VIEW + PANEL HARNESS ===================== -->

    <!-- Side view of UI panel -->
    <g transform="translate(40, 100)">
      <text x="0" y="-12" font-family="ui-monospace, monospace" font-size="11" fill="#8a8a8e" letter-spacing="0.08em">SIDE VIEW · USER UI STRIP</text>
      <rect x="0" y="0" width="340" height="190" rx="6" fill="#141418" stroke="#2a2a2f"/>

      <!-- yellow strip -->
      <rect x="22" y="70" width="296" height="58" rx="4" fill="url(#uiGrad)" stroke="var(--ui-edge)"/>

      <!-- OLED -->
      <rect x="40" y="86" width="64" height="26" rx="2" fill="#0a0a10" stroke="#000"/>
      <!-- buttons -->
      <circle cx="150" cy="99" r="9" fill="#0a0a10" stroke="#000"/>
      <circle cx="184" cy="99" r="9" fill="#0a0a10" stroke="#000"/>
      <circle cx="218" cy="99" r="9" fill="#0a0a10" stroke="#000"/>
      <!-- USB-C jack on the strip (the enclosure-mounted side of the extension cable) -->
      <rect x="250" y="92" width="52" height="16" rx="7" fill="#0a0a10" stroke="#000"/>

      <!-- callouts -->
      <line x1="72" y1="70" x2="72" y2="42" stroke="#9a9aa0" stroke-width="1" marker-end="url(#arrowS)"/>
      <text x="72" y="34" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#d6d6da">OLED · SSD1306 0.96"</text>

      <line x1="276" y1="92" x2="276" y2="42" stroke="#9a9aa0" stroke-width="1" marker-end="url(#arrowS)"/>
      <text x="276" y="34" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#d6d6da">USB-C · panel-mount</text>

      <line x1="150" y1="114" x2="150" y2="146" stroke="#9a9aa0" stroke-width="1" marker-end="url(#arrowS)"/>
      <text x="150" y="160" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#d6d6da">SELECT</text>

      <line x1="184" y1="114" x2="184" y2="146" stroke="#9a9aa0" stroke-width="1" marker-end="url(#arrowS)"/>
      <text x="184" y="174" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#d6d6da">MODE</text>

      <line x1="218" y1="114" x2="218" y2="146" stroke="#9a9aa0" stroke-width="1" marker-end="url(#arrowS)"/>
      <text x="218" y="160" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#d6d6da">POWER</text>
    </g>

    <!-- Panel components (flying leads, no PCB) -->
    <g transform="translate(40, 360)">
      <text x="0" y="-12" font-family="ui-monospace, monospace" font-size="11" fill="#8a8a8e" letter-spacing="0.08em">PANEL COMPONENTS · FLYING LEADS</text>
      <rect x="0" y="0" width="340" height="280" rx="6" fill="#141418" stroke="#2a2a2f"/>

      <!-- OLED module -->
      <rect x="24" y="24" width="120" height="80" rx="2" fill="#1a1a22" stroke="#3a3a40"/>
      <rect x="34" y="34" width="100" height="46" rx="1" fill="#04040a"/>
      <text x="84" y="61" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#5ea3ff" letter-spacing="0.04em">SSD1306 · I²C</text>
      <text x="84" y="76" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7" fill="#3a4060">128×64 OLED</text>
      <!-- 4-pin header on module -->
      <g fill="#c0a040">
        <rect x="40" y="92" width="6" height="8"/>
        <rect x="56" y="92" width="6" height="8"/>
        <rect x="72" y="92" width="6" height="8"/>
        <rect x="88" y="92" width="6" height="8"/>
      </g>
      <text x="42" y="116" font-family="ui-monospace, monospace" font-size="7" fill="#8a8a8e">VCC GND SCL SDA</text>

      <!-- 3 panel-mount buttons -->
      <g transform="translate(180, 30)">
        <circle cx="20" cy="20" r="18" fill="#1a1a22" stroke="#3a3a40"/>
        <circle cx="20" cy="20" r="11" fill="#0a0a10"/>
        <text x="20" y="56" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#d6d6da">SELECT</text>
        <text x="20" y="68" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7" fill="#8a8a8e">SW3 → GPIO2</text>
      </g>
      <g transform="translate(180, 110)">
        <circle cx="20" cy="20" r="18" fill="#1a1a22" stroke="#3a3a40"/>
        <circle cx="20" cy="20" r="11" fill="#0a0a10"/>
        <text x="20" y="56" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#d6d6da">MODE</text>
        <text x="20" y="68" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7" fill="#8a8a8e">SW2 → GPIO39</text>
      </g>
      <g transform="translate(260, 110)">
        <circle cx="20" cy="20" r="18" fill="#1a1a22" stroke="#3a3a40"/>
        <circle cx="20" cy="20" r="11" fill="#0a0a10"/>
        <text x="20" y="56" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#d6d6da">POWER</text>
        <text x="20" y="68" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7" fill="#8a8a8e">SW1 → GPIO36</text>
      </g>

      <!-- JST XH 10 housing -->
      <g transform="translate(94, 200)">
        <rect x="0" y="0" width="160" height="28" rx="2" fill="#1a1a22" stroke="#3a3a40"/>
        <g fill="#c0a040">
          <rect x="6" y="6" width="6" height="6"/><rect x="22" y="6" width="6" height="6"/>
          <rect x="38" y="6" width="6" height="6"/><rect x="54" y="6" width="6" height="6"/>
          <rect x="70" y="6" width="6" height="6"/><rect x="86" y="6" width="6" height="6"/>
          <rect x="102" y="6" width="6" height="6"/><rect x="118" y="6" width="6" height="6"/>
          <rect x="134" y="6" width="6" height="6"/><rect x="150" y="6" width="6" height="6"/>
        </g>
        <text x="80" y="46" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#d6d6da">JST XH 10 · to J_PANEL</text>
      </g>

      <!-- internal wires (sketch) -->
      <g stroke="#3a3a40" stroke-width="1" fill="none" stroke-dasharray="2 3" opacity="0.7">
        <path d="M70 100 L 90 130 L 90 200"/>
        <path d="M200 70 L 200 140 L 130 200"/>
        <path d="M200 150 L 200 190 L 170 200"/>
        <path d="M280 150 L 280 190 L 220 200"/>
      </g>
    </g>

    <!-- ===================== MAIN: MATRIX PCB (BOTTOM VIEW) ===================== -->

    <g transform="translate(440, 80)">
      <text x="380" y="-12" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#8a8a8e" letter-spacing="0.08em">CHESSBOARD · BOTTOM VIEW · back of matrix PCB</text>

      <!-- pcb body -->
      <rect x="0" y="0" width="760" height="760" rx="10" fill="var(--pcb)" stroke="var(--pcb-edge)" stroke-width="2"/>
      <rect x="22" y="22" width="716" height="716" rx="6" fill="url(#checker)"/>
      <rect x="22" y="22" width="716" height="716" rx="6" fill="url(#silkdot)" opacity="0.6"/>

      <!-- mounting holes -->
      <g fill="#0a0a0d" stroke="#3a3a40">
        <circle cx="14" cy="14" r="5"/>
        <circle cx="746" cy="14" r="5"/>
        <circle cx="14" cy="746" r="5"/>
        <circle cx="746" cy="746" r="5"/>
      </g>

      <!-- fiducials (3) -->
      <g fill="#9a9aa0">
        <circle cx="380" cy="38" r="3"/>
        <circle cx="38" cy="380" r="3"/>
        <circle cx="722" cy="380" r="3"/>
      </g>

      <!-- corner labels: H8 top-left (flipped), A1 bottom-right (flipped) -->
      <g font-family="ui-monospace, monospace" font-size="11" fill="#d6d6da">
        <rect x="38" y="38" width="40" height="22" rx="3" fill="#0d0d11" stroke="#3a3a40"/>
        <text x="58" y="53" text-anchor="middle">H8</text>

        <rect x="682" y="700" width="40" height="22" rx="3" fill="#0d0d11" stroke="#3a3a40"/>
        <text x="702" y="715" text-anchor="middle">A1</text>
      </g>

      <!-- center label -->
      <g font-family="ui-sans-serif, system-ui" fill="#d6d6da">
        <text x="380" y="200" text-anchor="middle" font-size="15" letter-spacing="0.08em">BACK OF MATRIX PCB</text>
        <text x="380" y="222" text-anchor="middle" font-size="11" fill="#8a8a8e">64× A3144 hall + 81× WS2812B — all on the front face</text>
        <text x="380" y="240" text-anchor="middle" font-size="11" fill="#8a8a8e">236 components · file-major U1=A1 .. U64=H8 · row-major D1=top-left .. D81=bottom-right</text>
      </g>

      <!-- ============ LIPO BATTERY (taped/strapped to PCB back) ============ -->
      <g transform="translate(130, 470)">
        <rect x="-3" y="6" width="200" height="120" rx="8" fill="#000" opacity="0.45" filter="url(#soft)"/>
        <rect x="0" y="0" width="200" height="120" rx="8" fill="url(#battGrad)" stroke="var(--battery-edge)" stroke-width="1.5"/>
        <!-- silver foil pouch hint -->
        <rect x="10" y="10" width="180" height="100" rx="6" fill="none" stroke="#c8cdd6" stroke-width="0.6" opacity="0.4"/>
        <!-- label -->
        <text x="100" y="50" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#0d0d11" letter-spacing="0.1em">1S LIPO · PROTECTED</text>
        <text x="100" y="68" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#0d0d11">1500 mAh</text>
        <text x="100" y="86" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#0d0d11" opacity="0.7">JST PH 2.0 pigtail →</text>
        <!-- battery wire pads on right edge -->
        <circle cx="200" cy="52" r="3" fill="#c8443a"/>
        <circle cx="200" cy="68" r="3" fill="#2a2a2f"/>
      </g>

      <!-- ============ JST PH BATTERY CABLE: LiPo → M1 ============ -->
      <g fill="none" stroke-width="2.4" stroke-linecap="round">
        <!-- red +BAT -->
        <path d="M 330 522 C 410 522, 460 560, 540 568" stroke="var(--cable-power)"/>
        <!-- black GND -->
        <path d="M 330 538 C 410 538, 460 576, 540 582" stroke="var(--cable-gnd)"/>
      </g>
      <text x="395" y="500" font-family="ui-monospace, monospace" font-size="9" fill="#d6d6da">JST PH 2.0 — LiPo cable</text>

      <!-- ============ CONTROLLER PCB ============ -->
      <g transform="translate(528, 470)">
        <!-- shadow -->
        <rect x="-3" y="6" width="320" height="270" rx="8" fill="#000" opacity="0.45" filter="url(#soft)"/>
        <!-- pcb body -->
        <rect x="0" y="0" width="320" height="270" rx="8" fill="url(#ctrlGrad)" stroke="var(--controller-edge)" stroke-width="1.5"/>

        <!-- silkscreen border -->
        <rect x="6" y="6" width="308" height="258" rx="6" fill="none" stroke="#f0b9b3" stroke-width="0.6" opacity="0.45" stroke-dasharray="3 3"/>

        <text x="160" y="22" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#ffe5e1" letter-spacing="0.16em">CONTROLLER PCB</text>

        <!-- M1: Seeed Lipo Rider Plus daughterboard -->
        <g transform="translate(14, 32)">
          <rect x="0" y="0" width="116" height="120" rx="4" fill="url(#m1Grad)" stroke="var(--m1-edge)"/>
          <text x="58" y="14" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#bce6cd" letter-spacing="0.08em">M1 · LIPO RIDER+</text>
          <!-- USB-C jack on M1 -->
          <rect x="40" y="-8" width="36" height="12" rx="3" fill="#0d0d11" stroke="#000"/>
          <text x="58" y="-12" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7" fill="#d6d6da">USB-C</text>
          <!-- JST PH 2.0 on M1 for LiPo -->
          <rect x="-8" y="46" width="14" height="24" rx="2" fill="#fff" stroke="#888"/>
          <text x="-8" y="42" font-family="ui-monospace, monospace" font-size="7" fill="#d6d6da">JST PH</text>
          <!-- 4-LED battery indicator -->
          <g fill="#ffd96b">
            <rect x="14" y="36" width="6" height="3"/>
            <rect x="24" y="36" width="6" height="3"/>
            <rect x="34" y="36" width="6" height="3"/>
            <rect x="44" y="36" width="6" height="3"/>
          </g>
          <text x="14" y="50" font-family="ui-monospace, monospace" font-size="6" fill="#bce6cd">SOC</text>
          <!-- slide switch -->
          <rect x="78" y="44" width="28" height="14" rx="2" fill="#1a1a1e" stroke="#000"/>
          <circle cx="92" cy="51" r="3" fill="#888"/>
          <text x="92" y="68" text-anchor="middle" font-family="ui-monospace, monospace" font-size="6" fill="#bce6cd">OFF | 5V | ON</text>
          <!-- 1x8 header (mounting) -->
          <g fill="#c0a040">
            <rect x="14" y="100" width="4" height="14"/>
            <rect x="26" y="100" width="4" height="14"/>
            <rect x="38" y="100" width="4" height="14"/>
            <rect x="50" y="100" width="4" height="14"/>
            <rect x="62" y="100" width="4" height="14"/>
            <rect x="74" y="100" width="4" height="14"/>
            <rect x="86" y="100" width="4" height="14"/>
            <rect x="98" y="100" width="4" height="14"/>
          </g>
          <text x="58" y="92" text-anchor="middle" font-family="ui-monospace, monospace" font-size="6" fill="#bce6cd">3V3 EN GND 5V GND BAT GND USB</text>
        </g>

        <!-- ESP32 DevKitC (U2) -->
        <g transform="translate(146, 32)">
          <rect x="0" y="0" width="84" height="170" rx="3" fill="var(--esp)" stroke="#000"/>
          <rect x="4" y="4" width="76" height="16" rx="1" fill="#1a1a22"/>
          <text x="42" y="14" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7" fill="#9a9aa0">U2 · ESP32-DevKitC v4</text>
          <!-- micro-USB jack at top (programming) -->
          <rect x="32" y="-7" width="20" height="9" rx="1" fill="#1a1a22" stroke="#000"/>
          <text x="42" y="-12" text-anchor="middle" font-family="ui-monospace, monospace" font-size="6" fill="#d6d6da">µUSB</text>
          <!-- EN reset button -->
          <rect x="4" y="-5" width="10" height="6" rx="1" fill="#888"/>
          <text x="9" y="-9" text-anchor="middle" font-family="ui-monospace, monospace" font-size="6" fill="#d6d6da">EN</text>
          <!-- pin headers -->
          <g fill="#3a3a40">
            <rect x="6" y="22" width="2" height="142"/>
            <rect x="76" y="22" width="2" height="142"/>
          </g>
          <!-- ESP32 module hint -->
          <rect x="14" y="34" width="56" height="48" rx="1" fill="#181820" stroke="#000"/>
          <text x="42" y="62" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7" fill="#9a9aa0">ESP32-WROOM</text>
        </g>

        <!-- U3 74AHCT125 level shifter (SOIC-14) -->
        <g transform="translate(244, 32)">
          <rect x="0" y="0" width="26" height="46" rx="1" fill="#0a0a10" stroke="#000"/>
          <text x="13" y="14" text-anchor="middle" font-family="ui-monospace, monospace" font-size="6" fill="#d6d6da">U3</text>
          <text x="13" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="5" fill="#9a9aa0">74AHCT</text>
          <text x="13" y="32" text-anchor="middle" font-family="ui-monospace, monospace" font-size="5" fill="#9a9aa0">125</text>
          <!-- pin1 dot -->
          <circle cx="4" cy="4" r="1" fill="#d6d6da"/>

        <!-- U6 TBD62783A column driver (DIP-18 / SOIC-18W) -->
        <g transform="translate(244, 86)">
          <rect x="0" y="0" width="26" height="70" rx="1" fill="#0a0a10" stroke="#000"/>
          <text x="13" y="14" text-anchor="middle" font-family="ui-monospace, monospace" font-size="6" fill="#d6d6da">U6</text>
          <text x="13" y="26" text-anchor="middle" font-family="ui-monospace, monospace" font-size="5" fill="#9a9aa0">TBD</text>
          <text x="13" y="34" text-anchor="middle" font-family="ui-monospace, monospace" font-size="5" fill="#9a9aa0">62783A</text>
          <text x="13" y="50" text-anchor="middle" font-family="ui-monospace, monospace" font-size="5" fill="#9a9aa0">8-CH HS</text>
          <circle cx="4" cy="4" r="1" fill="#d6d6da"/>

        <!-- D2 SS14 Schottky -->
        <g transform="translate(244, 166)">
          <rect x="0" y="0" width="22" height="8" rx="1" fill="#0a0a10" stroke="#000"/>
          <rect x="22" y="2" width="2" height="4" fill="#d6d6da"/>
          <text x="11" y="20" text-anchor="middle" font-family="ui-monospace, monospace" font-size="6" fill="#d6d6da">D2 · SS14</text>
        </g>

        <!-- R1..R8 row pullup array -->
        <g transform="translate(244, 188)">
          <rect x="0" y="0" width="60" height="14" rx="1" fill="#1a1a1e" stroke="#000"/>
          <g fill="#3a3a40">
            <rect x="3" y="3" width="4" height="8"/><rect x="10" y="3" width="4" height="8"/>

      <g font-family="ui-sans-serif, system-ui" font-size="12" fill="#d6d6da">
        <text x="0" y="24">· View is the underside of the matrix PCB. All Hall sensors (U1..U64) and WS2812B LEDs (D1..D81) are on the opposite (top) face.</text>
        <text x="0" y="44">· LiPo battery sits on the back of the matrix PCB (strapped/taped) and plugs into M1's onboard JST PH 2.0 socket. M1 charges via its own USB-C jack.</text>
        <text x="0" y="64">· The controller's M1 USB-C jack is mid-board, so a USB-C panel-mount extension cable routes the connection to the enclosure wall.</text>
        <text x="0" y="84">· The DevKitC's onboard micro-USB is used for firmware flashing — also needs enclosure access (cutout or removable panel). EN button is the only reset.</text>
        <text x="0" y="104">· J_MAIN ↔ J_CTRL is a board-to-board mate (2×13 keyed IDC, 26-wire ribbon ≤ 20 cm). Carries +5V_LED ×3, GND ×5, LED_DATA_5V, S0..S7, CA..CH_PWR.</text>
        <text x="0" y="124">· J_PANEL is JST XH 10-pin on the controller; flying-lead harness terminates at the OLED module and 3 panel-mount buttons (no panel PCB).</text>
        <text x="0" y="144">· Power chain: USB-C/LiPo → M1 → 5 V (= +5V_LED, sources matrix LEDs + D2 → DevKit pin 19 → onboard AMS1117 → ESP32) and 3 V3 (= +3V3, panel + pullups + OLED).</text>
